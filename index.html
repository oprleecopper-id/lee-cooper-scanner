<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background: #f5f5f5;

      min-height: 100vh;

      padding: 15px;

    }

    .container {

      width: 100%;

      max-width: 600px;

      margin: auto;

      background: white;

      border-radius: 20px;

      padding: 25px;

      box-shadow:
        0 10px 30px
        rgba(0,0,0,.10);

    }

    h1 {

      text-align: center;

      margin: 0;

      font-size: 30px;

      font-weight: 800;

    }

    .subtitle {

      text-align: center;

      margin-top: 7px;

      color: #666;

    }

    .user-box {

      margin-top: 20px;

      padding: 18px;

      background: #edf3ff;

      border-radius: 14px;

    }

    .user-label {

      font-size: 13px;

      color: #666;

    }

    .user {

      margin-top: 5px;

      font-size: 25px;

      font-weight: 800;

    }

    label {

      display: block;

      margin-top: 20px;

      margin-bottom: 8px;

      font-weight: 700;

    }

    input {

      width: 100%;

      height: 55px;

      border: 1px solid #ccc;

      border-radius: 10px;

      padding: 0 15px;

      font-size: 18px;

    }

    button {

      width: 100%;

      height: 55px;

      border: none;

      border-radius: 10px;

      font-size: 18px;

      font-weight: 800;

      cursor: pointer;

    }

    #scanButton {

      margin-top: 12px;

      background: #1976d2;

      color: white;

    }

    #saveButton {

      margin-top: 20px;

      background: #111;

      color: white;

    }

    button:disabled {

      background: #999 !important;

      cursor: not-allowed;

    }

    #reader {

      margin-top: 15px;

      width: 100%;

      overflow: hidden;

      border-radius: 12px;

      background: black;

    }

    #scannerArea {

      display: none;

      margin-top: 20px;

    }

    .status {

      margin-top: 15px;

      padding: 15px;

      border-radius: 10px;

      background: #f1f1f1;

      line-height: 1.5;

    }

    .success {

      background: #e2f7e9;

      color: #137333;

    }

    .error {

      background: #fde2e2;

      color: #b00020;

    }

    .warning {

      background: #fff4d6;

      color: #8a5a00;

    }

    .close {

      margin-top: 10px;

      background: #e53935;

      color: white;

    }

    .small {

      font-size: 13px;

      color: #777;

      margin-top: 8px;

      line-height: 1.5;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>
    LEE COOPER
  </h1>


  <div class="subtitle">
    SCANNER BARCODE SKU
  </div>


  <!-- USER -->

  <div class="user-box">

    <div class="user-label">
      SALES ASSISTANT
    </div>

    <div
      class="user"
      id="userDisplay">

      Memuat...

    </div>

  </div>


  <!-- TANGGAL -->

  <label>
    Tanggal Transaksi
  </label>

  <input
    type="date"
    id="tanggal">


  <!-- SKU -->

  <label>
    SKU
  </label>

  <input
    type="text"
    id="sku"
    placeholder="Scan atau ketik SKU..."
    autocomplete="off">


  <button
    type="button"
    id="scanButton"
    onclick="mulaiScanner()">

    📷 SCAN SKU

  </button>


  <!-- SCANNER -->

  <div id="scannerArea">

    <div id="reader"></div>

    <button
      type="button"
      class="close"
      onclick="stopScanner()">

      TUTUP KAMERA

    </button>

  </div>


  <!-- QTY -->

  <label>
    QTY
  </label>

  <input
    type="number"
    id="qty"
    value="1"
    min="1">


  <!-- DISCOUNT -->

  <label>
    Discount
  </label>

  <input
    type="number"
    id="diskon"
    min="0"
    placeholder="Opsional">


  <!-- SAVE -->

  <button
    type="button"
    id="saveButton"
    onclick="simpanData()">

    SIMPAN

  </button>


  <!-- STATUS -->

  <div
    id="status"
    class="status">

    Siap digunakan.

  </div>


  <div class="small">

    Hanya SKU yang terdapat di
    <b>Rekap Stok kolom A</b>
    yang dapat disimpan.

  </div>


</div>


<script>


/* =========================================================
   KONFIGURASI APPS SCRIPT
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx50fn9Y6LK_4VI0WytJlALv-uelJLRNn9pDKPIEwLNU3RUdkqu6f5Lnxc3IjyJezTv-A/exec";


/* =========================================================
   USER
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


let USER =
  String(
    params.get("user") || ""
  )
  .trim()
  .toUpperCase();


const DAFTAR_SA = [

  "ZAINAL",
  "CHIKA",
  "RETNO"

];


let scanner =
  null;


let scannerAktif =
  false;


/* =========================================================
   TANGGAL
   ========================================================= */

function setTanggal() {

  const input =
    document.getElementById(
      "tanggal"
    );


  const now =
    new Date();


  input.value =

    now.getFullYear() +

    "-" +

    String(
      now.getMonth() + 1
    ).padStart(2,"0") +

    "-" +

    String(
      now.getDate()
    ).padStart(2,"0");

}


/* =========================================================
   STATUS
   ========================================================= */

function status(
  text,
  type
) {

  const box =
    document.getElementById(
      "status"
    );


  box.innerHTML =
    text;


  box.className =
    "status";


  if (type) {

    box.classList.add(
      type
    );

  }

}


/* =========================================================
   INIT
   ========================================================= */

document.addEventListener(
  "DOMContentLoaded",
  function() {


    setTanggal();


    const userDisplay =
      document.getElementById(
        "userDisplay"
      );


    if (
      !DAFTAR_SA.includes(USER)
    ) {

      userDisplay.textContent =
        "SA TIDAK VALID";


      status(

        "<b>Link Sales Assistant tidak valid.</b>" +

        "<br><br>" +

        "Gunakan contoh:" +

        "<br>" +

        "<b>?user=RETNO</b>",

        "error"

      );


      document
        .getElementById(
          "scanButton"
        )
        .disabled = true;


      document
        .getElementById(
          "saveButton"
        )
        .disabled = true;


      return;

    }


    userDisplay.textContent =
      USER;


    document
      .getElementById(
        "sku"
      )
      .focus();

  }

);


/* =========================================================
   MULAI SCANNER
   ========================================================= */

async function mulaiScanner() {


  if (
    !DAFTAR_SA.includes(USER)
  ) {

    status(
      "Sales Assistant tidak valid.",
      "error"
    );

    return;

  }


  if (
    !window.isSecureContext
  ) {

    status(

      "<b>HTTPS diperlukan.</b>" +

      "<br><br>" +

      "Buka scanner melalui alamat GitHub Pages HTTPS.",

      "error"

    );

    return;

  }


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    status(

      "Library scanner belum dimuat. " +
      "Pastikan internet aktif lalu refresh.",

      "error"

    );

    return;

  }


  const area =
    document.getElementById(
      "scannerArea"
    );


  area.style.display =
    "block";


  const reader =
    document.getElementById(
      "reader"
    );


  reader.innerHTML =
    "";


  document
    .getElementById(
      "scanButton"
    )
    .disabled = true;


  status(
    "Meminta akses kamera...",
    "warning"
  );


  try {


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );


        return {

          width:
            size,

          height:
            size

        };

      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function() {

        // scan belum berhasil
        // normal

      }

    );


    scannerAktif =
      true;


    status(

      "Kamera aktif. " +
      "Arahkan kamera ke barcode SKU.",

      "success"

    );


  }

  catch(error) {


    console.error(
      error
    );


    scannerAktif =
      false;


    status(

      "<b>Kamera gagal dibuka.</b>" +

      "<br><br>" +

      "<b>Kamera tidak dapat digunakan.</b>" +

      "<br><br>" +

      "Pastikan izin kamera GitHub Pages " +
      "sudah diizinkan di Chrome." +

      "<br><br>" +

      "Detail: " +

      escapeHtml(
        error.message ||
        String(error)
      ),

      "error"

    );


    area.style.display =
      "none";


    document
      .getElementById(
        "scanButton"
      )
      .disabled = false;

  }

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {


  const sku =
    String(
      decodedText || ""
    )
    .trim()
    .toUpperCase();


  if (!sku) {
    return;
  }


  /* =======================================================
     STOP CAMERA
     ======================================================= */

  await stopScanner();


  /* =======================================================
     MASUKKAN SKU
     ======================================================= */

  document
    .getElementById(
      "sku"
    )
    .value =
    sku;


  status(

    "Barcode terbaca: <b>" +
    escapeHtml(sku) +
    "</b><br><br>" +
    "Memeriksa SKU di Rekap Stok...",

    "warning"

  );


  /* =======================================================
     CEK SKU KE APPS SCRIPT
     ======================================================= */

  try {


    const url =
      APPS_SCRIPT_URL +
      "?action=cekSKU" +
      "&user=" +
      encodeURIComponent(USER) +
      "&sku=" +
      encodeURIComponent(sku);


    const response =
      await fetch(
        url,
        {
          method: "GET"
        }
      );


    const hasil =
      await response.json();


    if (
      !hasil.exists
    ) {


      status(

        "<b>❌ SKU TIDAK DITEMUKAN</b>" +

        "<br><br>" +

        "SKU: <b>" +

        escapeHtml(sku) +

        "</b>" +

        "<br><br>" +

        "SKU ini tidak terdapat di " +

        "<b>Rekap Stok kolom A</b>." +

        "<br><br>" +

        "Data tidak dapat disimpan.",

        "error"

      );


      document
        .getElementById(
          "sku"
        )
        .focus();


      return;

    }


    /* =====================================================
       SKU VALID
       ===================================================== */

    status(

      "<b>✓ SKU VALID</b>" +

      "<br><br>" +

      "SKU <b>" +

      escapeHtml(sku) +

      "</b> ditemukan di Rekap Stok." +

      "<br><br>" +

      "Silakan isi QTY lalu tekan SIMPAN.",

      "success"

    );


    document
      .getElementById(
        "qty"
      )
      .focus();


  }

  catch(error) {


    console.error(
      error
    );


    status(

      "<b>Gagal memeriksa SKU.</b>" +

      "<br><br>" +

      "Pastikan Apps Script sudah di-deploy " +

      "sebagai Web App." +

      "<br><br>" +

      escapeHtml(
        error.message ||
        String(error)
      ),

      "error"

    );

  }

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner() {


  if (
    scanner &&
    scannerAktif
  ) {

    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        error
      );

    }

  }


  scannerAktif =
    false;


  scanner =
    null;


  const area =
    document.getElementById(
      "scannerArea"
    );


  area.style.display =
    "none";


  document
    .getElementById(
      "scanButton"
    )
    .disabled = false;

}


/* =========================================================
   SIMPAN DATA
   ========================================================= */

async function simpanData() {


  if (
    !DAFTAR_SA.includes(USER)
  ) {

    status(
      "Sales Assistant tidak valid.",
      "error"
    );

    return;

  }


  const tanggal =
    document
      .getElementById(
        "tanggal"
      )
      .value;


  const sku =
    document
      .getElementById(
        "sku"
      )
      .value
      .trim()
      .toUpperCase();


  const qty =
    Number(
      document
        .getElementById(
          "qty"
        )
        .value
    );


  const diskonInput =
    document
      .getElementById(
        "diskon"
      )
      .value;


  const diskon =
    diskonInput === ""
      ? 0
      : Number(
          diskonInput
        );


  /* =======================================================
     VALIDASI
     ======================================================= */

  if (!tanggal) {

    status(
      "Tanggal belum diisi.",
      "error"
    );

    return;

  }


  if (!sku) {

    status(
      "SKU belum diisi.",
      "error"
    );

    return;

  }


  if (
    !qty ||
    qty <= 0
  ) {

    status(
      "QTY harus lebih besar dari 0.",
      "error"
    );

    return;

  }


  if (
    isNaN(diskon) ||
    diskon < 0
  ) {

    status(
      "Discount tidak valid.",
      "error"
    );

    return;

  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled =
    true;


  button.textContent =
    "MENYIMPAN...";


  status(
    "Memeriksa SKU dan menyimpan data...",
    "warning"
  );


  try {


    /* =====================================================
       KIRIM KE APPS SCRIPT
       ===================================================== */

    const url =
      APPS_SCRIPT_URL +
      "?action=simpanInput" +
      "&user=" +
      encodeURIComponent(USER) +
      "&tanggal=" +
      encodeURIComponent(tanggal) +
      "&sku=" +
      encodeURIComponent(sku) +
      "&qty=" +
      encodeURIComponent(qty) +
      "&diskon=" +
      encodeURIComponent(diskon);


    const response =
      await fetch(
        url,
        {
          method: "GET"
        }
      );


    const hasil =
      await response.json();


    /* =====================================================
       SKU TIDAK VALID
       ===================================================== */

    if (
      hasil.invalidSKU
    ) {

      status(

        "<b>❌ DATA DITOLAK</b>" +

        "<br><br>" +

        escapeHtml(
          hasil.message
        ),

        "error"

      );


      return;

    }


    /* =====================================================
       BERHASIL
       ===================================================== */

    if (
      hasil.success
    ) {


      status(

        "<b>✓ DATA BERHASIL DISIMPAN</b>" +

        "<br><br>" +

        "SA: <b>" +

        escapeHtml(
          hasil.user
        ) +

        "</b>" +

        "<br>" +

        "Tanggal: <b>" +

        escapeHtml(
          hasil.tanggal
        ) +

        "</b>" +

        "<br>" +

        "SKU: <b>" +

        escapeHtml(
          hasil.sku
        ) +

        "</b>" +

        "<br>" +

        "QTY: <b>" +

        hasil.qty +

        "</b>",

        "success"

      );


      /* ===================================================
         RESET
         =================================================== */

      document
        .getElementById(
          "sku"
        )
        .value =
        "";


      document
        .getElementById(
          "qty"
        )
        .value =
        "1";


      document
        .getElementById(
          "diskon"
        )
        .value =
        "";


      document
        .getElementById(
          "sku"
        )
        .focus();


    }

    else {


      status(

        "<b>❌ GAGAL MENYIMPAN</b>" +

        "<br><br>" +

        escapeHtml(
          hasil.message ||
          "Data gagal disimpan."
        ),

        "error"

      );

    }

  }

  catch(error) {


    console.error(
      error
    );


    status(

      "<b>Terjadi kesalahan.</b>" +

      "<br><br>" +

      escapeHtml(
        error.message ||
        String(error)
      ),

      "error"

    );

  }

  finally {


    button.disabled =
      false;


    button.textContent =
      "SIMPAN";

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(
    value
  )

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   ENTER SKU
   ========================================================= */

document.addEventListener(
  "keydown",
  function(event) {


    if (
      event.key === "Enter" &&
      document.activeElement &&
      document.activeElement.id === "sku"
    ) {

      event.preventDefault();


      document
        .getElementById(
          "qty"
        )
        .focus();

    }

  }
);

</script>

</body>

</html>
