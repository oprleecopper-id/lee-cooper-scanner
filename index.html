<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>LEE COOPER - SCANNER</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      min-height: 100vh;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      text-align: center;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .subtitle {
      margin-top: 8px;
      color: #ccc;
      font-size: 18px;
    }

    #reader {
      width: 100%;
      margin-top: 25px;
      background: black;
      border-radius: 18px;
      overflow: hidden;
    }

    #status {
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #222;
      color: #ddd;
      font-size: 16px;
      line-height: 1.5;
    }

    #error {
      display: none;
      margin-top: 15px;
      padding: 15px;
      border-radius: 12px;
      background: #5a1111;
      color: #fff;
      text-align: left;
      line-height: 1.5;
    }

    .back {
      display: block;
      margin-top: 15px;
      width: 100%;
      height: 55px;
      line-height: 55px;
      border-radius: 12px;
      background: #444;
      color: white;
      text-decoration: none;
      font-weight: 800;
    }

  </style>

</head>


<body>

<div class="container">

  <h1>LEE COOPER</h1>

  <div class="subtitle">
    SCANNER BARCODE SKU
  </div>


  <div id="reader"></div>


  <div id="status">
    Menyiapkan kamera...
  </div>


  <div id="error"></div>


  <a
    id="back"
    class="back"
    href="#">

    KEMBALI

  </a>

</div>


<script>


/* =========================================================
   KONFIGURASI
   ========================================================= */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx50fn9Y6LK_4VI0WytJlALv-uelJLRNn9pDKPIEwLNU3RUdkqu6f5Lnxc3IjyJezTv-A/exec";


/* =========================================================
   USER DARI URL
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const user =
  String(
    params.get("user") || ""
  )
  .trim()
  .toUpperCase();


/* =========================================================
   ELEMEN
   ========================================================= */

const statusBox =
  document.getElementById(
    "status"
  );

const errorBox =
  document.getElementById(
    "error"
  );


/* =========================================================
   LINK KEMBALI
   ========================================================= */

document
  .getElementById(
    "back"
  )
  .href =
  APPS_SCRIPT_URL +
  "?user=" +
  encodeURIComponent(
    user
  );


/* =========================================================
   VALIDASI USER
   ========================================================= */

if (!user) {

  tampilkanError(
    "Sales Assistant tidak ditemukan."
  );

}


/* =========================================================
   SCANNER
   ========================================================= */

let scanner = null;

let sudahScan = false;


/* =========================================================
   MULAI
   ========================================================= */

async function mulaiScanner() {

  try {

    if (
      typeof Html5Qrcode ===
      "undefined"
    ) {

      throw new Error(
        "Library scanner gagal dimuat. Pastikan internet aktif."
      );

    }


    statusBox.innerHTML =
      "📷 Meminta izin kamera...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    /* =====================================================
       PILIH KAMERA BELAKANG
       ===================================================== */

    let cameraId =
      cameras[0].id;


    const belakang =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            )
            .toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("belakang")
          );

        }
      );


    if (belakang) {

      cameraId =
        belakang.id;

    }


    statusBox.innerHTML =
      "✓ Kamera aktif.<br>Arahkan kamera ke barcode SKU.";


    /* =====================================================
       KONFIGURASI
       ===================================================== */

    const config = {

      fps: 10,

      qrbox:
        function(
          width,
          height
        ) {

          const size =
            Math.min(
              width,
              height
            ) * 0.70;


          return {

            width:
              Math.floor(size),

            height:
              Math.floor(size)

          };

        },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /* =====================================================
       START
       ===================================================== */

    await scanner.start(

      cameraId,

      config,

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function(errorMessage) {

        // normal saat belum menemukan barcode

      }

    );


  }

  catch(error) {

    console.error(
      error
    );


    tampilkanError(
      jelaskanError(error)
    );

  }

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {

  if (sudahScan) {
    return;
  }


  const sku =
    String(
      decodedText || ""
    ).trim();


  if (!sku) {
    return;
  }


  sudahScan =
    true;


  statusBox.innerHTML =
    "✓ Barcode terbaca.<br>SKU: <b>" +
    escapeHtml(sku) +
    "</b><br><br>Mengirim ke form...";


  /* =====================================================
     STOP KAMERA
     ===================================================== */

  if (scanner) {

    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        error
      );

    }

  }


  /* =====================================================
     REDIRECT KE APPS SCRIPT
     ===================================================== */

  const url =
    APPS_SCRIPT_URL +
    "?user=" +
    encodeURIComponent(
      user
    ) +
    "&sku=" +
    encodeURIComponent(
      sku
    );


  setTimeout(
    function() {

      window.location.href =
        url;

    },
    500
  );

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilkanError(
  message
) {

  errorBox.style.display =
    "block";

  errorBox.innerHTML =
    message;

  statusBox.innerHTML =
    "Kamera gagal dibuka.";

}


/* =========================================================
   JELASKAN ERROR
   ========================================================= */

function jelaskanError(
  error
) {

  const text =
    String(
      error || ""
    );


  const lower =
    text.toLowerCase();


  if (
    lower.includes(
      "permission"
    ) ||
    lower.includes(
      "notallowed"
    ) ||
    lower.includes(
      "denied"
    )
  ) {

    return (

      "<b>IZIN KAMERA DITOLAK</b>" +

      "<br><br>" +

      "Buka pengaturan situs di Chrome → " +
      "Kamera → Izinkan → kemudian refresh halaman."

    );

  }


  if (
    lower.includes(
      "notfound"
    ) ||
    lower.includes(
      "camera not found"
    )
  ) {

    return (

      "<b>KAMERA TIDAK DITEMUKAN</b>" +

      "<br><br>" +

      "Pastikan HP memiliki kamera dan kamera " +
      "tidak sedang digunakan aplikasi lain."

    );

  }


  return (

    "<b>Kamera tidak dapat digunakan.</b>" +

    "<br><br>" +

    "Detail: " +

    escapeHtml(
      text
    )

  );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   JALANKAN
   ========================================================= */

if (user) {

  mulaiScanner();

}

</script>

</body>

</html>
