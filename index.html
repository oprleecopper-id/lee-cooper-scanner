<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0">

  <title>LEE COOPER - SCANNER</title>

  <!-- Library Barcode Scanner -->
  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;

      background: #111;

      color: white;

      font-family: Arial, sans-serif;

      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;

      margin: auto;
    }

    h1 {
      text-align: center;

      margin: 10px 0 5px;

      font-size: 28px;
    }

    .subtitle {
      text-align: center;

      color: #aaa;

      margin-bottom: 20px;
    }

    #reader {
      width: 100%;

      background: #000;

      border-radius: 15px;

      overflow: hidden;
    }

    #status {
      text-align: center;

      margin-top: 15px;

      color: #ddd;

      font-size: 16px;
    }

    #result {
      display: none;

      margin-top: 20px;

      padding: 20px;

      background: #e8f5e9;

      color: #1b5e20;

      border-radius: 15px;

      text-align: center;
    }

    #sku {
      margin-top: 10px;

      font-size: 28px;

      font-weight: bold;

      word-break: break-all;
    }

    #error {
      display: none;

      margin-top: 15px;

      padding: 15px;

      background: #ffebee;

      color: #b71c1c;

      border-radius: 12px;

      line-height: 1.5;
    }

    button {
      width: 100%;

      margin-top: 15px;

      height: 55px;

      border: 0;

      border-radius: 12px;

      background: #e53935;

      color: white;

      font-size: 18px;

      font-weight: bold;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>LEE COOPER</h1>

  <div class="subtitle">
    SCANNER BARCODE SKU
  </div>


  <!-- CAMERA -->
  <div id="reader"></div>


  <!-- STATUS -->
  <div id="status">
    Menyiapkan kamera...
  </div>


  <!-- HASIL -->
  <div id="result">

    <div>
      ✓ BARCODE TERBACA
    </div>

    <div id="sku"></div>

  </div>


  <!-- ERROR -->
  <div id="error"></div>


  <!-- TUTUP -->
  <button onclick="tutup()">
    KEMBALI
  </button>

</div>


<script>


/* =====================================================
   VARIABLE
   ===================================================== */

let scanner = null;

let sudahScan = false;


/* =====================================================
   RETURN URL
   ===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const returnUrl =
  params.get("return");


/* =====================================================
   MULAI SCANNER
   ===================================================== */

function mulaiScanner() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilError(
      "Library scanner tidak berhasil dimuat."
    );

    return;
  }


  scanner =
    new Html5Qrcode("reader");


  const config = {

    fps: 10,

    qrbox: {
      width: 250,
      height: 150
    },

    aspectRatio: 1.7777778,

    formatsToSupport: [

      Html5QrcodeSupportedFormats.EAN_13,

      Html5QrcodeSupportedFormats.EAN_8,

      Html5QrcodeSupportedFormats.CODE_128,

      Html5QrcodeSupportedFormats.CODE_39,

      Html5QrcodeSupportedFormats.UPC_A,

      Html5QrcodeSupportedFormats.UPC_E

    ]

  };


  /*
   * LANGSUNG MINTA KAMERA BELAKANG
   */

  scanner.start(

    {
      facingMode: "environment"
    },

    config,

    function(decodedText) {

      barcodeBerhasil(
        decodedText
      );

    },

    function(errorMessage) {

      // Tidak perlu menampilkan
      // error scan sementara.

    }

  )

  .then(function() {

    document
      .getElementById("status")
      .textContent =
      "Arahkan kamera ke barcode SKU.";

  })

  .catch(function(error) {

    console.error(error);

    tampilError(
      buatPesanError(error)
    );

  });

}


/* =====================================================
   BARCODE BERHASIL
   ===================================================== */

function barcodeBerhasil(
  barcode
) {

  if (sudahScan) {
    return;
  }


  sudahScan = true;


  const sku =
    String(
      barcode
    ).trim();


  document
    .getElementById("sku")
    .textContent =
    sku;


  document
    .getElementById("result")
    .style.display =
    "block";


  document
    .getElementById("status")
    .textContent =
    "Barcode berhasil dibaca.";


  /*
   * STOP KAMERA
   */

  if (scanner) {

    scanner.stop()

      .then(function() {

        console.log(
          "Scanner stopped."
        );

      })

      .catch(function(error) {

        console.log(error);

      });

  }


  /*
   * KEMBALI KE FORM
   */

  if (returnUrl) {

    setTimeout(
      function() {

        const separator =
          returnUrl.includes("?")
            ? "&"
            : "?";


        window.location.href =
          returnUrl +
          separator +
          "sku=" +
          encodeURIComponent(
            sku
          );

      },
      1000
    );

  }

}


/* =====================================================
   ERROR
   ===================================================== */

function tampilError(
  pesan
) {

  const error =
    document.getElementById(
      "error"
    );


  error.innerHTML =
    pesan;


  error.style.display =
    "block";


  document
    .getElementById("status")
    .textContent =
    "Kamera tidak dapat digunakan.";

}


/* =====================================================
   PESAN ERROR
   ===================================================== */

function buatPesanError(
  error
) {

  const text =
    String(
      error || ""
    );


  const lower =
    text.toLowerCase();


  if (
    lower.includes(
      "notallowed"
    ) ||
    lower.includes(
      "permission"
    ) ||
    lower.includes(
      "denied"
    )
  ) {

    return (

      "<b>AKSES KAMERA DITOLAK</b>" +

      "<br><br>" +

      "Buka pengaturan Chrome dan pastikan " +

      "izin Kamera untuk situs ini diizinkan."

    );

  }


  if (
    lower.includes(
      "notfound"
    )
  ) {

    return (

      "<b>KAMERA TIDAK DITEMUKAN</b>" +

      "<br><br>" +

      "Pastikan HP memiliki kamera dan " +

      "kamera tidak sedang digunakan aplikasi lain."

    );

  }


  if (
    lower.includes(
      "notreadable"
    )
  ) {

    return (

      "<b>KAMERA SEDANG DIGUNAKAN</b>" +

      "<br><br>" +

      "Tutup aplikasi Kamera, WhatsApp, " +

      "Instagram, Google Lens, atau aplikasi " +

      "lain yang sedang menggunakan kamera."

    );

  }


  return (

    "<b>SCANNER TIDAK DAPAT MEMBUKA KAMERA</b>" +

    "<br><br>" +

    "Error: " +

    text

  );

}


/* =====================================================
   TUTUP
   ===================================================== */

function tutup() {

  if (scanner) {

    scanner.stop()

      .catch(function() {})

      .finally(function() {

        kembali();

      });

  }

  else {

    kembali();

  }

}


/* =====================================================
   KEMBALI KE FORM
   ===================================================== */

function kembali() {

  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

}


/* =====================================================
   START
   ===================================================== */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


</script>


</body>

</html>
