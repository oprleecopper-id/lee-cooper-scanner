<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>


  <!-- HTML5 QR CODE -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background:
        linear-gradient(
          135deg,
          #090909,
          #1d1d1d
        );

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 15px;

    }


    .container {

      width: 100%;

      max-width: 600px;

      background: #181818;

      border-radius: 22px;

      padding: 20px;

      box-shadow:
        0 15px 45px
        rgba(0,0,0,.45);

    }


    .brand {

      text-align: center;

      margin-bottom: 18px;

    }


    .brand h1 {

      margin: 0;

      font-size: 30px;

      font-weight: 900;

      letter-spacing: 1px;

    }


    .brand p {

      margin:
        7px 0 0;

      color: #aaa;

      font-size: 14px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    .camera-box {

      position: relative;

      width: 100%;

      background: #000;

      border-radius: 17px;

      overflow: hidden;

      border:
        1px solid #333;

    }


    #reader {

      width: 100%;

      min-height: 300px;

      background: #000;

    }


    /*
     * Scanner library biasanya membuat
     * video sendiri.
     */

    #reader video {

      width: 100% !important;

      height: auto !important;

      object-fit: cover !important;

    }


    .scan-guide {

      position: absolute;

      left: 50%;

      top: 50%;

      width: 72%;

      height: 34%;

      transform:
        translate(-50%, -50%);

      border:
        2px solid
        rgba(255,255,255,.85);

      border-radius: 14px;

      pointer-events: none;

      box-shadow:
        0 0 0 9999px
        rgba(0,0,0,.18);

    }


    .status {

      text-align: center;

      margin-top: 16px;

      color: #d5d5d5;

      font-size: 15px;

      line-height: 1.5;

      min-height: 23px;

    }


    .success {

      display: none;

      background: #14351e;

      color: #a7f3b8;

      padding: 15px;

      border-radius: 13px;

      margin-top: 15px;

      text-align: center;

      font-size: 17px;

      font-weight: 800;

      line-height: 1.5;

    }


    .error {

      display: none;

      background: #3a1515;

      color: #ffb4b4;

      padding: 16px;

      margin-top: 15px;

      border-radius: 13px;

      line-height: 1.6;

      font-size: 14px;

      text-align: center;

    }


    .back {

      display: block;

      width: 100%;

      height: 53px;

      margin-top: 18px;

      border: none;

      border-radius: 13px;

      background: #d71920;

      color: white;

      font-size: 17px;

      font-weight: 900;

      cursor: pointer;

    }


    .back:hover {

      background: #b91218;

    }


    .hint {

      text-align: center;

      color: #888;

      font-size: 12px;

      margin-top: 14px;

    }


    @media(max-width:600px) {

      body {

        padding: 8px;

        align-items: flex-start;

      }


      .container {

        margin-top: 8px;

        padding: 13px;

        border-radius: 18px;

      }


      .brand h1 {

        font-size: 25px;

      }


      #reader {

        min-height: 280px;

      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="brand">

    <h1>LEE COOPER</h1>

    <p>SCANNER BARCODE SKU</p>

  </div>


  <div class="camera-box">

    <div id="reader"></div>

    <div class="scan-guide"></div>

  </div>


  <div
    id="status"
    class="status">

    Menyiapkan kamera...

  </div>


  <div
    id="success"
    class="success">
  </div>


  <div
    id="error"
    class="error">
  </div>


  <button
    class="back"
    type="button"
    onclick="kembali()">

    KEMBALI

  </button>


  <div class="hint">

    Arahkan kamera ke barcode SKU

  </div>


</div>


<script>


/* =========================================================
   SCANNER
   ========================================================= */

let scanner = null;

let scannerAktif = false;

let barcodeSedangDiproses = false;


/* =========================================================
   ELEMENT
   ========================================================= */

const statusBox =
  document.getElementById(
    "status"
  );


const successBox =
  document.getElementById(
    "success"
  );


const errorBox =
  document.getElementById(
    "error"
  );


/* =========================================================
   KIRIM STATUS KE FORM
   ========================================================= */

function kirimStatusSiap() {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          "LEE_COOPER_SCANNER_READY"
      },

      "*"

    );

  }

}


/* =========================================================
   KIRIM BARCODE KE FORM
   ========================================================= */

function kirimBarcode(sku) {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          "LEE_COOPER_BARCODE",

        sku:
          sku

      },

      "*"

    );

    return true;

  }


  return false;

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {


  /*
   * Jangan proses banyak frame
   * secara bersamaan.
   */

  if (
    barcodeSedangDiproses
  ) {

    return;

  }


  const sku =
    String(
      decodedText || ""
    )
    .trim();


  if (!sku) {

    return;

  }


  barcodeSedangDiproses =
    true;


  statusBox.textContent =
    "Barcode terbaca. Memeriksa SKU...";


  errorBox.style.display =
    "none";


  successBox.style.display =
    "none";


  /*
   * PENTING:
   *
   * Scanner TIDAK mengecek Google Sheet.
   *
   * Scanner hanya mengirim barcode
   * ke halaman Apps Script.
   *
   * Apps Script yang akan mengecek:
   *
   * REKAP STOK!A:A
   *
   * Jika tidak ada -> ditolak.
   */

  const berhasil =
    kirimBarcode(sku);


  if (!berhasil) {

    barcodeSedangDiproses =
      false;


    tampilkanError(

      "<b>FORM TIDAK DITEMUKAN</b>" +

      "<br><br>" +

      "Buka scanner melalui tombol " +

      "<b>SCAN</b> dari Form Daily Stock."

    );

    return;

  }


  /*
   * Karena Apps Script yang menentukan
   * valid / tidak valid,
   * scanner belum langsung ditutup.
   *
   * Tunggu keputusan dari Form.
   */

}


/* =========================================================
   TERIMA HASIL VALIDASI DARI FORM
   ========================================================= */

window.addEventListener(
  "message",
  async function(event) {


    /*
     * Hanya menerima pesan
     * dari halaman Apps Script.
     */

    if (
      event.origin !==
      "https://script.google.com" &&

      event.origin !==
      "https://script.googleusercontent.com"
    ) {

      return;

    }


    const data =
      event.data;


    if (!data) {
      return;
    }


    /* =====================================================
       SKU VALID
       ===================================================== */

    if (
      data.type ===
      "LEE_COOPER_SKU_VALID"
    ) {


      barcodeSedangDiproses =
        true;


      successBox.innerHTML =

        "✓ SKU VALID" +

        "<br><br>" +

        "<b>" +

        escapeHtml(
          data.sku || ""
        ) +

        "</b>" +

        "<br><br>" +

        "SKU terdaftar di REKAP STOK.";


      successBox.style.display =
        "block";


      statusBox.textContent =
        "SKU valid. Mengirim ke Form...";


      await stopScanner();


      setTimeout(
        function() {

          window.close();

        },
        500
      );


      return;

    }


    /* =====================================================
       SKU TIDAK VALID
       ===================================================== */

    if (
      data.type ===
      "LEE_COOPER_SKU_INVALID"
    ) {


      /*
       * JANGAN tutup kamera.
       *
       * User bisa langsung
       * scan SKU berikutnya.
       */

      barcodeSedangDiproses =
        false;


      successBox.style.display =
        "none";


      tampilkanError(

        "<b>✕ SKU DITOLAK</b>" +

        "<br><br>" +

        "SKU <b>" +

        escapeHtml(
          data.sku || ""
        ) +

        "</b> tidak ditemukan " +

        "di <b>REKAP STOK</b>." +

        "<br><br>" +

        "Silakan scan SKU yang terdaftar."

      );


      statusBox.textContent =
        "Kamera tetap aktif. Scan SKU lain.";


      return;

    }


    /* =====================================================
       ERROR VALIDASI
       ===================================================== */

    if (
      data.type ===
      "LEE_COOPER_SKU_ERROR"
    ) {


      barcodeSedangDiproses =
        false;


      tampilkanError(

        "<b>GAGAL MEMERIKSA SKU</b>" +

        "<br><br>" +

        escapeHtml(
          data.message ||
          "Terjadi kesalahan."
        )

      );


      statusBox.textContent =
        "Kamera tetap aktif.";


      return;

    }

  }
);


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner() {

  if (
    scanner &&
    scannerAktif
  ) {

    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        "Stop scanner:",
        error
      );

    }

  }


  scannerAktif =
    false;

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilkanError(
  message
) {

  errorBox.innerHTML =
    message;

  errorBox.style.display =
    "block";

}


/* =========================================================
   MULAI KAMERA
   ========================================================= */

async function mulaiScanner() {


  /*
   * Pastikan library tersedia.
   */

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilkanError(

      "<b>SCANNER GAGAL DIMUAT</b>" +

      "<br><br>" +

      "Library scanner tidak tersedia." +

      "<br><br>" +

      "Pastikan internet aktif kemudian refresh."

    );

    statusBox.textContent =
      "Scanner gagal dimuat.";

    return;

  }


  try {


    statusBox.textContent =
      "Meminta izin kamera...";


    /*
     * Buat scanner.
     */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * Konfigurasi barcode.
     */

    const config = {

      fps: 10,


      qrbox:
        function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.72
            );


          return {

            width:
              size,

            height:
              size

          };

        },


      aspectRatio:
        1.0,


      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /*
     * START CAMERA
     *
     * Ini bagian yang sengaja
     * dibuat sederhana.
     *
     * Tidak ada fetch.
     * Tidak ada akses Google Sheet.
     * Tidak ada return URL.
     */

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Error scanning frame
         * adalah normal.
         */

      }

    );


    scannerAktif =
      true;


    statusBox.textContent =
      "Kamera aktif. Arahkan ke barcode SKU.";


    kirimStatusSiap();

  }

  catch(error) {

    console.error(
      error
    );


    const text =
      String(
        error &&
        (
          error.message ||
          error.name ||
          error
        )
      );


    const lower =
      text.toLowerCase();


    if (

      lower.includes(
        "notallowederror"
      ) ||

      lower.includes(
        "permission"
      ) ||

      lower.includes(
        "denied"
      )

    ) {


      tampilkanError(

        "<b>IZIN KAMERA DITOLAK</b>" +

        "<br><br>" +

        "Buka pengaturan situs di Chrome " +

        "→ Kamera → Izinkan → kemudian " +

        "refresh halaman."

      );


      statusBox.textContent =
        "Kamera tidak dapat digunakan.";

    }


    else if (

      lower.includes(
        "notfounderror"
      )

    ) {


      tampilkanError(

        "<b>KAMERA TIDAK DITEMUKAN</b>" +

        "<br><br>" +

        "Pastikan perangkat memiliki kamera."

      );


      statusBox.textContent =
        "Kamera tidak ditemukan.";

    }


    else {


      tampilkanError(

        "<b>KAMERA TIDAK DAPAT DIGUNAKAN</b>" +

        "<br><br>" +

        escapeHtml(text)

      );


      statusBox.textContent =
        "Kamera gagal dibuka.";

    }

  }

}


/* =========================================================
   KEMBALI
   ========================================================= */

async function kembali() {

  await stopScanner();


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.close();

  }

  else {

    history.back();

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


/* =========================================================
   SEBELUM HALAMAN DITUTUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      scannerAktif
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);

</script>


</body>

</html>
