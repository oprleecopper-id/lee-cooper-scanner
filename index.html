<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 15px;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin: 10px 0 5px;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: #000;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      text-align: center;
      margin-top: 15px;
      color: #ddd;
      font-size: 16px;
    }

    #error {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #ffebee;
      color: #b71c1c;
      border-radius: 12px;
      line-height: 1.5;
    }

    #result {
      display: none;
      margin-top: 15px;
      padding: 15px;
      background: #e8f5e9;
      color: #1b5e20;
      border-radius: 12px;
      text-align: center;
    }

    #sku {
      font-size: 25px;
      font-weight: bold;
      word-break: break-all;
    }

    button {
      width: 100%;
      margin-top: 15px;
      height: 55px;
      border: 0;
      border-radius: 12px;
      background: #e53935;
      color: white;
      font-size: 18px;
      font-weight: bold;
    }

  </style>

</head>


<body>


<div class="container">


  <h1>LEE COOPER</h1>

  <div class="subtitle">
    SCANNER BARCODE SKU
  </div>


  <div id="reader"></div>


  <div id="status">
    Memulai kamera...
  </div>


  <div id="result">

    ✓ BARCODE TERBACA

    <div id="sku"></div>

  </div>


  <div id="error"></div>


  <button
    type="button"
    onclick="kembali()">

    KEMBALI

  </button>


</div>


<script>


/* =========================================================
   VARIABEL
   ========================================================= */

let scanner = null;

let sudahScan = false;


/* =========================================================
   RETURN URL DARI FORM
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get("return");


/* =========================================================
   MULAI
   ========================================================= */

async function mulaiScanner() {

  const status =
    document.getElementById(
      "status"
    );


  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilError(
      "Library scanner gagal dimuat. Pastikan internet aktif."
    );

    return;

  }


  try {

    status.textContent =
      "Meminta izin kamera...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: {
        width: 280,
        height: 160
      },

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /*
     * LANGSUNG MINTA KAMERA BELAKANG
     */

    await scanner.start(

      {
        facingMode: "environment"
      },

      config,

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function() {

        /*
         * Error scanning sementara
         * tidak perlu ditampilkan.
         */

      }

    );


    status.textContent =
      "Kamera aktif. Arahkan ke barcode SKU.";


  }

  catch (error) {

    console.error(error);

    tampilError(
      jelaskanError(error)
    );

  }

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {

  if (sudahScan) {
    return;
  }


  sudahScan = true;


  const sku =
    String(
      decodedText || ""
    ).trim();


  if (!sku) {

    sudahScan = false;

    return;

  }


  document
    .getElementById(
      "sku"
    )
    .textContent =
    sku;


  document
    .getElementById(
      "result"
    )
    .style.display =
    "block";


  document
    .getElementById(
      "status"
    )
    .textContent =
    "Barcode berhasil dibaca.";


  /*
   * MATIKAN KAMERA
   */

  if (scanner) {

    try {

      await scanner.stop();

    }

    catch (error) {

      console.log(error);

    }

  }


  /*
   * KEMBALI KE FORM
   */

  if (returnUrl) {

    const separator =
      returnUrl.includes("?")
        ? "&"
        : "?";


    setTimeout(
      function() {

        window.location.href =
          returnUrl +
          separator +
          "sku=" +
          encodeURIComponent(
            sku
          );

      },
      500
    );

  }

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilError(
  message
) {

  const box =
    document.getElementById(
      "error"
    );


  box.innerHTML =
    message;


  box.style.display =
    "block";


  document
    .getElementById(
      "status"
    )
    .textContent =
    "Kamera tidak dapat digunakan.";

}


function jelaskanError(
  error
) {

  const text =
    String(
      error || ""
    );


  const lower =
    text.toLowerCase();


  if (
    lower.includes(
      "notallowederror"
    ) ||
    lower.includes(
      "permission"
    ) ||
    lower.includes(
      "denied"
    )
  ) {

    return (

      "<b>IZIN KAMERA DITOLAK</b>" +

      "<br><br>" +

      "Buka pengaturan situs di Chrome → " +
      "Kamera → Izinkan → kemudian refresh halaman."

    );

  }


  if (
    lower.includes(
      "notfounderror"
    )
  ) {

    return (

      "<b>KAMERA TIDAK DITEMUKAN</b>" +

      "<br><br>" +

      "Pastikan kamera HP tersedia dan tidak " +
      "sedang digunakan aplikasi lain."

    );

  }


  if (
    lower.includes(
      "notreadableerror"
    )
  ) {

    return (

      "<b>KAMERA SEDANG DIGUNAKAN</b>" +

      "<br><br>" +

      "Tutup aplikasi lain yang menggunakan kamera."

    );

  }


  return (

    "<b>SCANNER TIDAK DAPAT MEMBUKA KAMERA</b>" +

    "<br><br>" +

    escapeHtml(
      text
    )

  );

}


/* =========================================================
   KEMBALI
   ========================================================= */

function kembali() {

  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   START
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


</script>


</body>

</html>
