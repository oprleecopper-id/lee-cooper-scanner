<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>

  <script
    src="https://unpkg.com/html5-qrcode"
    type="text/javascript">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #111;
      color: white;
      font-family: Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: #1c1c1c;
      border-radius: 20px;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 28px;
    }

    .subtitle {
      text-align: center;
      margin-top: 8px;
      color: #bbb;
      margin-bottom: 20px;
    }

    #reader {
      width: 100%;
      background: black;
      border-radius: 15px;
      overflow: hidden;
    }

    #status {
      margin-top: 15px;
      text-align: center;
      font-size: 15px;
      line-height: 1.5;
      color: #ddd;
    }

    #error {
      display: none;
      margin-top: 15px;
      background: #3b1111;
      color: #ffbaba;
      border-radius: 12px;
      padding: 15px;
      line-height: 1.5;
    }

    #back {
      display: none;
      width: 100%;
      height: 52px;
      margin-top: 15px;
      border: none;
      border-radius: 12px;
      background: #e53935;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .success {
      background: #123b1d !important;
      color: #a8ffb8 !important;
    }

  </style>

</head>


<body>


<div class="container">

  <h1>
    LEE COOPER
  </h1>

  <div class="subtitle">
    SCANNER BARCODE SKU
  </div>


  <div id="reader"></div>


  <div id="status">
    Menyiapkan kamera...
  </div>


  <div id="error"></div>


  <button
    id="back"
    onclick="kembali()">

    KEMBALI

  </button>


</div>


<script>


/* =========================================================
   PARAMETER URL
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const USER =
  (
    params.get("user") ||
    ""
  )
  .trim()
  .toUpperCase();


const RETURN_URL =
  params.get(
    "returnUrl"
  );


/* =========================================================
   SCANNER
   ========================================================= */

let scanner = null;

let scannerStarted = false;

let sudahScan = false;


/* =========================================================
   ELEMENT
   ========================================================= */

const statusBox =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const backButton =
  document.getElementById(
    "back"
  );


/* =========================================================
   VALIDASI USER
   ========================================================= */

const DAFTAR_SA = [
  "ZAINAL",
  "CHIKA",
  "RETNO"
];


if (
  !DAFTAR_SA.includes(USER)
) {

  tampilError(
    "Sales Assistant tidak ditemukan."
  );

}


/* =========================================================
   VALIDASI RETURN URL
   ========================================================= */

else if (!RETURN_URL) {

  tampilError(
    "Alamat kembali ke Google Apps Script tidak ditemukan."
  );

}


/* =========================================================
   MULAI SCANNER
   ========================================================= */

else {

  mulaiScanner();

}


/* =========================================================
   MULAI SCANNER
   ========================================================= */

async function mulaiScanner() {

  try {

    statusBox.textContent =
      "Meminta izin kamera...";


    /*
     * Cek browser
     */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung akses kamera."
      );

    }


    /*
     * REQUEST KAMERA LANGSUNG
     */

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video: {
          facingMode: {
            ideal: "environment"
          }
        },

        audio: false

      });


    /*
     * Izin kamera berhasil.
     *
     * Matikan stream sementara.
     * html5-qrcode akan membuka kamera
     * sendiri setelah ini.
     */

    stream
      .getTracks()
      .forEach(
        track => track.stop()
      );


    statusBox.textContent =
      "Kamera siap. Arahkan ke barcode SKU.";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    /*
     * Cari kamera belakang
     */

    let cameraId =
      cameras[0].id;


    const kameraBelakang =
      cameras.find(
        camera => {

          const label =
            String(
              camera.label || ""
            )
            .toLowerCase();


          return (
            label.includes("back") ||
            label.includes("rear") ||
            label.includes("environment") ||
            label.includes("belakang")
          );

        }
      );


    if (kameraBelakang) {

      cameraId =
        kameraBelakang.id;

    }


    /*
     * KONFIGURASI
     */

    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.70
          );


        return {

          width:
            size,

          height:
            size

        };

      },

      aspectRatio: 1.0,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /*
     * START
     */

    await scanner.start(

      cameraId,

      config,

      function(decodedText) {

        barcodeDitemukan(
          decodedText
        );

      },

      function() {

        /*
         * Error scan sementara
         * tidak perlu ditampilkan
         */

      }

    );


    scannerStarted =
      true;


  }

  catch (error) {

    console.error(
      error
    );


    tampilError(
      jelaskanError(error)
    );

  }

}


/* =========================================================
   BARCODE DITEMUKAN
   ========================================================= */

async function barcodeDitemukan(
  barcode
) {

  if (sudahScan) {
    return;
  }


  sudahScan = true;


  const sku =
    String(
      barcode || ""
    )
    .trim();


  if (!sku) {

    sudahScan =
      false;

    return;

  }


  statusBox.textContent =
    "Barcode terbaca: " +
    sku +
    ". Mengirim ke Google Apps Script...";


  statusBox.classList.add(
    "success"
  );


  /*
   * STOP CAMERA
   */

  await stopScanner();


  /*
   * KEMBALI KE APPS SCRIPT
   *
   * Contoh:
   *
   * https://script.google.com/.../exec
   * ?user=RETNO
   * &sku=123456789
   */

  const kembaliUrl =
    RETURN_URL +
    "?user=" +
    encodeURIComponent(USER) +
    "&sku=" +
    encodeURIComponent(sku);


  /*
   * REDIRECT
   */

  window.location.href =
    kembaliUrl;

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner() {

  if (
    scanner &&
    scannerStarted
  ) {

    try {

      await scanner.stop();

    }

    catch (error) {

      console.log(
        error
      );

    }

  }


  scannerStarted =
    false;

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilError(
  message
) {

  statusBox.textContent =
    "Kamera gagal dibuka.";


  errorBox.innerHTML =
    message;


  errorBox.style.display =
    "block";


  backButton.style.display =
    "block";

}


/* =========================================================
   JELASKAN ERROR
   ========================================================= */

function jelaskanError(
  error
) {

  const text =
    String(
      error || ""
    );


  const lower =
    text.toLowerCase();


  if (
    lower.includes(
      "notallowederror"
    ) ||
    lower.includes(
      "permission"
    ) ||
    lower.includes(
      "denied"
    )
  ) {

    return (

      "<b>IZIN KAMERA DITOLAK</b>" +
      "<br><br>" +

      "Buka pengaturan situs di Chrome " +
      "→ Kamera → Izinkan → kemudian " +
      "refresh halaman." +

      "<br><br>" +

      "Pastikan izin diberikan untuk:" +
      "<br>" +

      "oprleecopper-id.github.io"

    );

  }


  if (
    lower.includes(
      "notfounderror"
    )
  ) {

    return (

      "<b>KAMERA TIDAK DITEMUKAN</b>" +
      "<br><br>" +

      "Pastikan HP memiliki kamera " +
      "dan tidak sedang digunakan aplikasi lain."

    );

  }


  return (

    "<b>KAMERA TIDAK DAPAT DIGUNAKAN.</b>" +
    "<br><br>" +

    "Detail: " +

    escapeHtml(
      text
    )

  );

}


/* =========================================================
   KEMBALI
   ========================================================= */

function kembali() {

  if (RETURN_URL) {

    window.location.href =
      RETURN_URL +
      "?user=" +
      encodeURIComponent(
        USER
      );

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}

</script>


</body>

</html>
