<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>


  <!-- HTML5 QR CODE -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 15px;

    }

    .container {

      width: 100%;

      max-width: 600px;

      background: #181818;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,.40);

    }

    .title {

      text-align: center;

      font-size: 28px;

      font-weight: 900;

      margin-bottom: 6px;

    }

    .subtitle {

      text-align: center;

      color: #aaa;

      font-size: 15px;

      margin-bottom: 20px;

    }

    #reader {

      width: 100%;

      background: #000;

      border-radius: 15px;

      overflow: hidden;

      min-height: 300px;

    }

    .status {

      text-align: center;

      margin-top: 15px;

      color: #ccc;

      font-size: 15px;

      line-height: 1.5;

    }

    .error {

      display: none;

      background: #3a1515;

      color: #ffb4b4;

      padding: 16px;

      margin-top: 15px;

      border-radius: 12px;

      line-height: 1.5;

      font-size: 14px;

      text-align: center;

    }

    .success {

      display: none;

      background: #14351e;

      color: #a7f3b8;

      padding: 16px;

      border-radius: 12px;

      margin-top: 15px;

      text-align: center;

      font-size: 17px;

      font-weight: 700;

    }

    .back {

      display: block;

      width: 100%;

      height: 52px;

      margin-top: 18px;

      border: none;

      border-radius: 12px;

      background: #e53935;

      color: white;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

    }

    .back:hover {

      background: #c62828;

    }

    @media(max-width:600px) {

      body {
        padding: 8px;
      }

      .container {
        padding: 12px;
      }

      .title {
        font-size: 23px;
      }

      #reader {
        min-height: 280px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="title">

    LEE COOPER

  </div>


  <div class="subtitle">

    SCANNER BARCODE SKU

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status">

    Menyiapkan kamera...

  </div>


  <div
    id="success"
    class="success">

  </div>


  <div
    id="error"
    class="error">

  </div>


  <button
    class="back"
    onclick="kembali()">

    KEMBALI

  </button>


</div>


<script>


/* =========================================================
   KONFIGURASI
   ========================================================= */

let scanner = null;

let scannerAktif = false;

let sedangMemproses = false;


/* =========================================================
   ELEMENT
   ========================================================= */

const statusBox =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const successBox =
  document.getElementById(
    "success"
  );


/* =========================================================
   BARCODE TERBACA
   ========================================================= */

function barcodeBerhasil(
  decodedText
) {

  /*
   * Jangan proses barcode berkali-kali
   */

  if (sedangMemproses) {
    return;
  }


  const sku =
    String(
      decodedText || ""
    ).trim();


  if (!sku) {
    return;
  }


  sedangMemproses = true;


  statusBox.textContent =
    "Memeriksa SKU...";


  errorBox.style.display =
    "none";


  successBox.style.display =
    "none";


  /*
   * KIRIM KE TAB FORM
   *
   * Form yang akan mengecek
   * SKU ke REKAP STOK.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          "LEE_COOPER_BARCODE",

        sku:
          sku

      },

      "https://script.google.com"

    );

  }

  else {

    sedangMemproses = false;

    tampilkanError(

      "<b>FORM TIDAK DITEMUKAN</b>" +

      "<br><br>" +

      "Silakan buka scanner dari " +
      "Form Daily Stock."

    );

  }

}


/* =========================================================
   TERIMA HASIL VALIDASI DARI FORM
   ========================================================= */

window.addEventListener(
  "message",
  async function(event) {


    /*
     * Hanya menerima dari GitHub sendiri
     * untuk keamanan.
     *
     * Perintah sebenarnya datang dari
     * halaman Apps Script parent.
     */

    if (
      event.origin !==
      "https://script.google.com"
    ) {

      return;

    }


    const data =
      event.data;


    if (!data) {
      return;
    }


    /* =====================================================
       SKU VALID
       ===================================================== */

    if (
      data.type ===
      "LEE_COOPER_SKU_VALID"
    ) {

      statusBox.textContent =
        "✓ SKU valid. Menutup scanner...";


      successBox.innerHTML =
        "✓ SKU VALID<br><br>" +
        "Barcode diterima oleh Form.";

      successBox.style.display =
        "block";


      await stopScanner();


      /*
       * OTOMATIS TUTUP
       */

      setTimeout(
        function() {

          try {

            window.close();

          }

          catch(error) {

            console.log(error);

          }

        },
        500
      );


      return;

    }


    /* =====================================================
       SKU DITOLAK
       ===================================================== */

    if (
      data.type ===
      "LEE_COOPER_SKU_INVALID"
    ) {

      sedangMemproses = false;


      successBox.style.display =
        "none";


      tampilkanError(

        "<b>✕ SKU DITOLAK</b>" +

        "<br><br>" +

        "SKU <b>" +
        escapeHtml(data.sku || "") +
        "</b> tidak terdapat di " +

        "<b>REKAP STOK</b>." +

        "<br><br>" +

        "Silakan scan barcode yang terdaftar."

      );


      statusBox.textContent =
        "Kamera tetap aktif. Silakan scan lagi.";


      return;

    }

  }
);


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner() {

  if (
    scanner &&
    scannerAktif
  ) {

    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        "Stop scanner:",
        error
      );

    }

  }


  scannerAktif =
    false;

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilkanError(
  message
) {

  errorBox.innerHTML =
    message;

  errorBox.style.display =
    "block";

}


/* =========================================================
   START SCANNER
   ========================================================= */

async function mulaiScanner() {

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilkanError(

      "<b>SCANNER LIBRARY GAGAL DIMUAT</b>" +

      "<br><br>" +

      "Periksa koneksi internet lalu refresh."

    );

    return;

  }


  try {

    statusBox.textContent =
      "Meminta izin kamera...";


    scanner =
      new Html5Qrcode(
        "reader"
      );


    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.72
          );


        return {

          width:
            size,

          height:
            size

        };

      },

      aspectRatio: 1.0,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /*
     * KAMERA BELAKANG
     */

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Error scan sementara
         * diabaikan.
         */

      }

    );


    scannerAktif =
      true;


    statusBox.textContent =
      "Kamera aktif. Arahkan ke barcode SKU.";


  }

  catch(error) {

    console.error(error);


    const text =
      String(
        error &&
        (
          error.message ||
          error.name ||
          error
        )
      );


    const lower =
      text.toLowerCase();


    if (
      lower.includes("notallowederror") ||
      lower.includes("permission") ||
      lower.includes("denied")
    ) {

      tampilkanError(

        "<b>IZIN KAMERA DITOLAK</b>" +

        "<br><br>" +

        "Buka pengaturan situs Chrome " +

        "→ Kamera → Izinkan → refresh halaman."

      );

    }

    else if (
      lower.includes("notfounderror")
    ) {

      tampilkanError(

        "<b>KAMERA TIDAK DITEMUKAN</b>" +

        "<br><br>" +

        "Pastikan perangkat memiliki kamera."

      );

    }

    else {

      tampilkanError(

        "<b>KAMERA TIDAK DAPAT DIGUNAKAN</b>" +

        "<br><br>" +

        escapeHtml(text)

      );

    }

  }

}


/* =========================================================
   KEMBALI
   ========================================================= */

async function kembali() {

  await stopScanner();


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.close();

  }

  else {

    history.back();

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


/* =========================================================
   SEBELUM DITUTUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      scannerAktif
    ) {

      scanner.stop()
        .catch(
          function() {}
        );

    }

  }
);


</script>


</body>

</html>
