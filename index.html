<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>


  <!-- HTML5 QR CODE -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 15px;

    }


    .container {

      width: 100%;

      max-width: 600px;

      background: #181818;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,.40);

    }


    .title {

      text-align: center;

      font-size: 26px;

      font-weight: 800;

      margin-bottom: 8px;

    }


    .subtitle {

      text-align: center;

      color: #aaa;

      font-size: 16px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      background: #000;

      border-radius: 15px;

      overflow: hidden;

      min-height: 300px;

    }


    .status {

      text-align: center;

      margin-top: 15px;

      color: #ccc;

      font-size: 15px;

      line-height: 1.5;

    }


    .error {

      display: none;

      background: #3a1515;

      color: #ffb4b4;

      padding: 15px;

      margin-top: 15px;

      border-radius: 12px;

      line-height: 1.5;

      font-size: 14px;

    }


    .back {

      display: block;

      width: 100%;

      height: 52px;

      margin-top: 18px;

      border: none;

      border-radius: 12px;

      background: #e53935;

      color: white;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

    }


    .back:hover {

      background: #c62828;

    }


    .success {

      display: none;

      background: #14351e;

      color: #a7f3b8;

      padding: 15px;

      border-radius: 12px;

      margin-top: 15px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;

    }


    .checking {

      display: none;

      background: #29230d;

      color: #ffe28a;

      padding: 15px;

      border-radius: 12px;

      margin-top: 15px;

      text-align: center;

      font-size: 16px;

      font-weight: 700;

    }


    @media(max-width:600px) {

      body {
        padding: 8px;
      }

      .container {
        padding: 12px;
      }

      .title {
        font-size: 23px;
      }

      #reader {
        min-height: 280px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="title">

    LEE COOPER

  </div>


  <div class="subtitle">

    SCANNER BARCODE SKU

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status">

    Menyiapkan kamera...

  </div>


  <div
    id="checking"
    class="checking">

    MEMERIKSA SKU...

  </div>


  <div
    id="success"
    class="success">

    ✓ BARCODE TERBACA

  </div>


  <div
    id="error"
    class="error">
  </div>


  <button
    class="back"
    onclick="kembali()">

    KEMBALI

  </button>


</div>


<script>


/* =========================================================
   KONFIGURASI
   ========================================================= */

let scanner =
  null;

let scannerAktif =
  false;

let barcodeSedangDicek =
  false;


/*
 * URL WEB APP APPS SCRIPT
 *
 * INI HARUS URL /exec ANDA.
 */

const APPS_SCRIPT_URL =
  "https://script.google.com/macros/s/AKfycbx50fn9Y6LK_4VI0WytJlALv-uelJLRNn9pDKPIEwLNU3RUdkqu6f5Lnxc3IjyJezTv-A/exec";


/* =========================================================
   ELEMENT
   ========================================================= */

const statusBox =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const successBox =
  document.getElementById(
    "success"
  );


const checkingBox =
  document.getElementById(
    "checking"
  );


/* =========================================================
   URL FORM
   ========================================================= */

function getReturnUrl() {

  const params =
    new URLSearchParams(
      window.location.search
    );


  const returnUrl =
    params.get(
      "return"
    );


  /*
   * Jika tidak ada return URL,
   * gunakan URL Apps Script utama.
   */

  if (
    returnUrl
  ) {

    return returnUrl;

  }


  return APPS_SCRIPT_URL;

}


/* =========================================================
   KIRIM KE FORM
   ========================================================= */

function kirimKeForm(
  sku
) {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        type:
          "LEE_COOPER_BARCODE",

        sku:
          sku

      },

      "*"

    );

    return true;

  }


  return false;

}


/* =========================================================
   STATUS SIAP
   ========================================================= */

function kirimStatusSiap() {

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {

        type:
          "LEE_COOPER_SCANNER_READY"

      },

      "*"

    );

  }

}


/* =========================================================
   BARCODE TERBACA
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {


  /*
   * Jangan proses dua barcode
   * secara bersamaan.
   */

  if (
    barcodeSedangDicek
  ) {

    return;

  }


  const sku =
    String(
      decodedText || ""
    )
    .trim();


  if (!sku) {

    return;

  }


  barcodeSedangDicek =
    true;


  /*
   * UI
   */

  errorBox.style.display =
    "none";

  successBox.style.display =
    "none";

  checkingBox.style.display =
    "block";


  statusBox.textContent =
    "Barcode terbaca. Memeriksa SKU...";


  /*
   * STOP CAMERA SEMENTARA
   *
   * Kamera dihentikan agar barcode
   * tidak terbaca berkali-kali.
   */

  await stopScanner();


  /*
   * URL Apps Script
   */

  const returnUrl =
    getReturnUrl();


  try {


    /*
     * BUAT URL CEK SKU
     */

    const separator =
      returnUrl.includes("?")
        ? "&"
        : "?";


    const checkUrl =
      returnUrl +
      separator +
      "checkSku=" +
      encodeURIComponent(
        sku
      );


    /*
     * PANGGIL APPS SCRIPT
     */

    const response =
      await fetch(
        checkUrl,
        {
          method:
            "GET",

          cache:
            "no-store"
        }
      );


    if (
      !response.ok
    ) {

      throw new Error(
        "Server Apps Script tidak dapat dihubungi."
      );

    }


    const hasil =
      await response.json();


    checkingBox.style.display =
      "none";


    /*
     * =====================================================
     * SKU TIDAK ADA
     * =====================================================
     */

    if (
      !hasil ||
      hasil.valid !== true
    ) {

      barcodeSedangDicek =
        false;


      errorBox.innerHTML =

        "<b>✕ SKU DITOLAK</b>" +

        "<br><br>" +

        "SKU <b>" +

        escapeHtml(
          sku
        ) +

        "</b> tidak ditemukan " +

        "di <b>REKAP STOK</b>." +

        "<br><br>" +

        "Barcode tidak dikirim ke Form.";


      errorBox.style.display =
        "block";


      statusBox.textContent =
        "SKU tidak terdaftar. Silakan scan lagi.";


      /*
       * Kamera hidup lagi.
       */

      await mulaiScanner();


      return;

    }


    /*
     * =====================================================
     * SKU VALID
     * =====================================================
     */

    successBox.innerHTML =

      "✓ SKU VALID" +

      "<br><br>" +

      "<b>" +

      escapeHtml(
        sku
      ) +

      "</b>";


    successBox.style.display =
      "block";


    statusBox.textContent =
      "SKU valid. Mengirim ke Form...";


    /*
     * KIRIM KE FORM
     */

    const berhasilKirim =
      kirimKeForm(
        sku
      );


    if (
      !berhasilKirim
    ) {

      throw new Error(
        "Halaman Form Daily Stock tidak ditemukan."
      );

    }


    statusBox.textContent =
      "✓ SKU berhasil dikirim ke Form.";


    /*
     * TUTUP SCANNER
     */

    setTimeout(
      function() {

        try {

          window.close();

        }

        catch(error) {

          console.log(
            error
          );

        }

      },
      700
    );

  }


  catch(error) {

    console.error(
      error
    );


    checkingBox.style.display =
      "none";


    barcodeSedangDicek =
      false;


    errorBox.innerHTML =

      "<b>GAGAL MEMERIKSA SKU</b>" +

      "<br><br>" +

      escapeHtml(

        error.message ||
        String(error)

      );


    errorBox.style.display =
      "block";


    statusBox.textContent =
      "Gagal menghubungi server.";


    /*
     * Coba hidupkan kamera kembali.
     */

    await mulaiScanner();

  }

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner() {

  if (
    scanner &&
    scannerAktif
  ) {

    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        "Stop scanner:",
        error
      );

    }

  }


  scannerAktif =
    false;

}


/* =========================================================
   ERROR KAMERA
   ========================================================= */

function tampilkanError(
  message
) {

  errorBox.innerHTML =
    message;

  errorBox.style.display =
    "block";


  statusBox.textContent =
    "Kamera tidak dapat digunakan.";

}


/* =========================================================
   MULAI SCANNER
   ========================================================= */

async function mulaiScanner() {


  /*
   * Jangan membuat scanner
   * kedua jika sudah aktif.
   */

  if (
    scannerAktif
  ) {

    return;

  }


  /*
   * Library
   */

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilkanError(

      "<b>SCANNER LIBRARY GAGAL DIMUAT</b>" +

      "<br><br>" +

      "Pastikan internet aktif " +

      "kemudian refresh halaman."

    );

    return;

  }


  /*
   * Bersihkan pesan lama
   */

  errorBox.style.display =
    "none";


  try {


    statusBox.textContent =
      "Meminta izin kamera...";


    /*
     * Buat scanner baru
     */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * KONFIGURASI
     */

    const config = {

      fps:
        10,


      qrbox:
        function(
          width,
          height
        ) {

          const size =
            Math.floor(

              Math.min(
                width,
                height
              ) * 0.72

            );


          return {

            width:
              size,

            height:
              size

          };

        },


      aspectRatio:
        1.0,


      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /*
     * START CAMERA
     */

    await scanner.start(

      {

        facingMode:
          "environment"

      },

      config,


      function(
        decodedText
      ) {

        barcodeBerhasil(
          decodedText
        );

      },


      function(
        errorMessage
      ) {

        /*
         * Error scan sementara
         * tidak ditampilkan.
         */

      }

    );


    scannerAktif =
      true;


    statusBox.textContent =
      "Kamera aktif. Arahkan ke barcode SKU.";


    kirimStatusSiap();

  }


  catch(error) {


    console.error(
      error
    );


    /*
     * Reset scanner
     */

    scanner =
      null;

    scannerAktif =
      false;


    const text =
      String(

        error &&
        (
          error.message ||
          error.name ||
          error
        )

      );


    const lower =
      text.toLowerCase();


    /*
     * IZIN KAMERA
     */

    if (

      lower.includes(
        "notallowederror"
      )

      ||

      lower.includes(
        "permission"
      )

      ||

      lower.includes(
        "denied"
      )

    ) {

      tampilkanError(

        "<b>IZIN KAMERA DITOLAK</b>" +

        "<br><br>" +

        "Buka pengaturan situs di Chrome " +

        "→ Kamera → Izinkan → kemudian " +

        "refresh halaman."

      );

    }


    /*
     * KAMERA TIDAK ADA
     */

    else if (

      lower.includes(
        "notfounderror"
      )

      ||

      lower.includes(
        "no camera"
      )

    ) {

      tampilkanError(

        "<b>KAMERA TIDAK DITEMUKAN</b>" +

        "<br><br>" +

        "Pastikan HP memiliki kamera " +

        "dan kamera tidak sedang digunakan " +

        "aplikasi lain."

      );

    }


    /*
     * ERROR LAIN
     */

    else {

      tampilkanError(

        "<b>KAMERA TIDAK DAPAT DIGUNAKAN</b>" +

        "<br><br>" +

        escapeHtml(
          text
        )

      );

    }

  }

}


/* =========================================================
   KEMBALI
   ========================================================= */

async function kembali() {

  await stopScanner();


  if (
    window.opener &&
    !window.opener.closed
  ) {

    try {

      window.close();

    }

    catch(error) {

      console.log(
        error
      );

    }

  }

  else {

    history.back();

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   HALAMAN LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


/* =========================================================
   SEBELUM HALAMAN DITUTUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      scannerAktif
    ) {

      scanner
        .stop()
        .catch(
          function() {}
        );

    }

  }
);


</script>


</body>

</html>
