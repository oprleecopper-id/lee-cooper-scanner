<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }

    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 15px;

    }


    .container {

      width: 100%;

      max-width: 600px;

      text-align: center;

    }


    h1 {

      font-size: 28px;

      margin: 0 0 8px;

    }


    .subtitle {

      color: #bbb;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      min-height: 300px;

      background: #000;

      border-radius: 18px;

      overflow: hidden;

    }


    #status {

      margin-top: 15px;

      padding: 15px;

      border-radius: 12px;

      background: #222;

      color: #ddd;

      line-height: 1.5;

    }


    #error {

      display: none;

      margin-top: 15px;

      padding: 15px;

      border-radius: 12px;

      background: #5c1515;

      color: white;

      text-align: left;

      line-height: 1.6;

    }


    button {

      width: 100%;

      height: 55px;

      margin-top: 15px;

      border: 0;

      border-radius: 12px;

      background: #e53935;

      color: white;

      font-size: 18px;

      font-weight: bold;

    }


    .success {

      background: #14532d !important;

    }


    .loading {

      padding: 70px 20px;

      color: #aaa;

    }

  </style>

</head>


<body>


<div class="container">


  <h1>LEE COOPER</h1>

  <div class="subtitle">
    SCANNER BARCODE SKU
  </div>


  <div id="reader">

    <div class="loading">
      Menyiapkan kamera...
    </div>

  </div>


  <div id="status">
    Meminta izin kamera...
  </div>


  <div id="error"></div>


  <button
    onclick="kembali()">

    KEMBALI

  </button>


</div>


<script>


/* =========================================================
   PARAMETER
   ========================================================= */

const params =
  new URLSearchParams(
    window.location.search
  );


const returnUrl =
  params.get("returnUrl");


/* =========================================================
   SCANNER
   ========================================================= */

let scanner = null;

let sudahScan = false;


/* =========================================================
   STATUS
   ========================================================= */

function status(text) {

  document
    .getElementById("status")
    .innerHTML =
    text;

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilkanError(text) {

  const box =
    document
      .getElementById("error");

  box.innerHTML =
    text;

  box.style.display =
    "block";

}


/* =========================================================
   KEMBALI
   ========================================================= */

function kembali() {

  if (returnUrl) {

    window.location.href =
      returnUrl;

  }

  else {

    history.back();

  }

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

function barcodeBerhasil(
  decodedText
) {

  if (sudahScan) {
    return;
  }

  sudahScan =
    true;


  const sku =
    String(decodedText || "")
      .trim();


  if (!sku) {

    sudahScan =
      false;

    return;

  }


  status(
    "✓ Barcode terbaca: <b>" +
    escapeHtml(sku) +
    "</b><br>Memproses..."
  );


  if (scanner) {

    scanner.stop()

      .then(
        function() {

          kirimSKU(sku);

        }
      )

      .catch(
        function() {

          kirimSKU(sku);

        }
      );

  }

  else {

    kirimSKU(sku);

  }

}


/* =========================================================
   KIRIM SKU KE APPS SCRIPT
   ========================================================= */

function kirimSKU(sku) {

  if (!returnUrl) {

    tampilkanError(

      "<b>Alamat kembali tidak tersedia.</b>" +
      "<br><br>" +
      "Scanner harus dibuka melalui tombol SCAN " +
      "pada Form Daily Stock."

    );

    return;

  }


  const separator =
    returnUrl.includes("?")
      ? "&"
      : "?";


  const target =
    returnUrl +
    separator +
    "sku=" +
    encodeURIComponent(sku);


  status(
    "✓ SKU ditemukan.<br>" +
    "Kembali ke form..."
  );


  setTimeout(
    function() {

      window.location.href =
        target;

    },
    500
  );

}


/* =========================================================
   START SCANNER
   ========================================================= */

async function mulaiScanner() {

  try {

    status(
      "Meminta izin kamera..."
    );


    /* =====================================================
       CEK BROWSER
       ===================================================== */

    if (
      !navigator.mediaDevices ||
      !navigator.mediaDevices.getUserMedia
    ) {

      throw new Error(
        "Browser tidak mendukung akses kamera."
      );

    }


    /* =====================================================
       REQUEST KAMERA
       ===================================================== */

    const stream =
      await navigator.mediaDevices
        .getUserMedia({

          video: {

            facingMode: {
              ideal: "environment"
            }

          },

          audio: false

        });


    /* =====================================================
       MATIKAN STREAM TEST
       ===================================================== */

    stream
      .getTracks()
      .forEach(
        function(track) {

          track.stop();

        }
      );


    status(
      "Izin kamera berhasil.<br>" +
      "Menyiapkan scanner..."
    );


    /* =====================================================
       BUAT SCANNER
       ===================================================== */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /* =====================================================
       CARI KAMERA
       ===================================================== */

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        "Kamera tidak ditemukan."
      );

    }


    let cameraId =
      cameras[0].id;


    const belakang =
      cameras.find(
        function(camera) {

          const label =
            String(
              camera.label || ""
            )
            .toLowerCase();


          return (

            label.includes("back") ||

            label.includes("rear") ||

            label.includes("environment") ||

            label.includes("belakang")

          );

        }
      );


    if (belakang) {

      cameraId =
        belakang.id;

    }


    /* =====================================================
       START
       ===================================================== */

    await scanner.start(

      cameraId,

      {

        fps: 10,

        qrbox: function(
          width,
          height
        ) {

          const size =
            Math.floor(
              Math.min(
                width,
                height
              ) * 0.70
            );

          return {

            width:
              size,

            height:
              size

          };

        },

        formatsToSupport: [

          Html5QrcodeSupportedFormats.EAN_13,

          Html5QrcodeSupportedFormats.EAN_8,

          Html5QrcodeSupportedFormats.CODE_128,

          Html5QrcodeSupportedFormats.CODE_39,

          Html5QrcodeSupportedFormats.UPC_A,

          Html5QrcodeSupportedFormats.UPC_E

        ]

      },

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function(errorMessage) {

        // scan error normal
        // tidak perlu ditampilkan

      }

    );


    status(
      "📷 Kamera aktif.<br>" +
      "Arahkan kamera ke barcode SKU."
    );


  }

  catch (error) {

    console.error(error);


    tampilkanError(

      "<b>Kamera tidak dapat digunakan.</b>" +

      "<br><br>" +

      "<b>IZIN KAMERA DITOLAK</b>" +

      "<br><br>" +

      "Buka pengaturan situs di Chrome → " +
      "Kamera → Izinkan → kemudian refresh halaman." +

      "<br><br>" +

      "Detail: " +

      escapeHtml(
        error.message ||
        String(error)
      )

    );


    status(
      "Kamera gagal dibuka."
    );

  }

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHtml(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   LOAD
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    setTimeout(
      mulaiScanner,
      500
    );

  }
);


</script>


</body>

</html>
