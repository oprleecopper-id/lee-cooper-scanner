<!DOCTYPE html>
<html lang="id">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1">

  <title>LEE COOPER - SCANNER</title>


  <!-- HTML5 QR CODE -->

  <script
    src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js">
  </script>


  <style>

    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      min-height: 100vh;

      background: #111;

      color: white;

      font-family:
        Arial,
        Helvetica,
        sans-serif;

      display: flex;

      justify-content: center;

      align-items: center;

      padding: 15px;

    }


    .container {

      width: 100%;

      max-width: 600px;

      background: #181818;

      border-radius: 20px;

      padding: 20px;

      box-shadow:
        0 10px 40px
        rgba(0,0,0,.40);

    }


    .title {

      text-align: center;

      font-size: 26px;

      font-weight: 800;

      margin-bottom: 8px;

    }


    .subtitle {

      text-align: center;

      color: #aaa;

      font-size: 16px;

      margin-bottom: 20px;

    }


    #reader {

      width: 100%;

      background: #000;

      border-radius: 15px;

      overflow: hidden;

      min-height: 300px;

    }


    .status {

      text-align: center;

      margin-top: 15px;

      color: #ccc;

      font-size: 15px;

      line-height: 1.5;

    }


    .error {

      display: none;

      background: #3a1515;

      color: #ffb4b4;

      padding: 15px;

      margin-top: 15px;

      border-radius: 12px;

      line-height: 1.5;

      font-size: 14px;

    }


    .back {

      display: block;

      width: 100%;

      height: 52px;

      margin-top: 18px;

      border: none;

      border-radius: 12px;

      background: #e53935;

      color: white;

      font-size: 17px;

      font-weight: 800;

      cursor: pointer;

    }


    .success {

      display: none;

      background: #14351e;

      color: #a7f3b8;

      padding: 15px;

      border-radius: 12px;

      margin-top: 15px;

      text-align: center;

      font-size: 18px;

      font-weight: 700;

    }


    @media(max-width:600px) {

      body {
        padding: 8px;
      }

      .container {
        padding: 12px;
      }

      .title {
        font-size: 23px;
      }

      #reader {
        min-height: 280px;
      }

    }

  </style>

</head>


<body>


<div class="container">


  <div class="title">

    LEE COOPER

  </div>


  <div class="subtitle">

    SCANNER BARCODE SKU

  </div>


  <div id="reader"></div>


  <div
    id="status"
    class="status">

    Menyiapkan kamera...

  </div>


  <div
    id="success"
    class="success">

    ✓ BARCODE TERBACA

  </div>


  <div
    id="error"
    class="error">
  </div>


  <button
    class="back"
    onclick="kembali()">

    KEMBALI

  </button>


</div>


<script>


/* =========================================================
   KONFIGURASI
   ========================================================= */


let scanner = null;

let scannerAktif = false;

let barcodeSudahTerbaca = false;


/* =========================================================
   ELEMENT
   ========================================================= */

const statusBox =
  document.getElementById(
    "status"
  );


const errorBox =
  document.getElementById(
    "error"
  );


const successBox =
  document.getElementById(
    "success"
  );


/* =========================================================
   KIRIM PESAN KE HALAMAN PEMBUKA
   ========================================================= */

function kirimKeParent(
  data
) {

  /*
   * Kirim ke window/tab yang membuka scanner.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      data,

      "https://script.google.com"

    );

  }

}


/* =========================================================
   NOTIFIKASI SCANNER SIAP
   ========================================================= */

function kirimStatusSiap() {

  /*
   * Karena Apps Script dapat menggunakan
   * beberapa host berbeda, kita juga kirim
   * menggunakan wildcard.
   *
   * Ini tidak berisi data sensitif.
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          "LEE_COOPER_SCANNER_READY"
      },

      "*"

    );

  }

}


/* =========================================================
   BARCODE BERHASIL
   ========================================================= */

async function barcodeBerhasil(
  decodedText
) {

  if (
    barcodeSudahTerbaca
  ) {

    return;

  }


  const sku =
    String(
      decodedText || ""
    ).trim();


  if (!sku) {

    return;

  }


  barcodeSudahTerbaca =
    true;


  statusBox.textContent =
    "Barcode terbaca. Mengirim SKU...";


  successBox.style.display =
    "block";


  /*
   * KIRIM SKU
   */

  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.opener.postMessage(

      {
        type:
          "LEE_COOPER_BARCODE",

        sku:
          sku
      },

      "*"

    );

  }


  /*
   * STOP SCANNER
   */

  await stopScanner();


  statusBox.textContent =
    "SKU " +
    sku +
    " berhasil dikirim.";


  /*
   * Tutup tab otomatis
   *
   * Browser bisa saja melarang close().
   */

  setTimeout(
    function() {

      try {

        window.close();

      }

      catch(error) {

        console.log(
          error
        );

      }

    },
    700
  );

}


/* =========================================================
   STOP SCANNER
   ========================================================= */

async function stopScanner() {

  if (
    scanner &&
    scannerAktif
  ) {

    try {

      await scanner.stop();

    }

    catch(error) {

      console.log(
        "Stop scanner:",
        error
      );

    }

  }


  scannerAktif =
    false;

}


/* =========================================================
   ERROR
   ========================================================= */

function tampilkanError(
  message
) {

  errorBox.innerHTML =
    message;

  errorBox.style.display =
    "block";


  statusBox.textContent =
    "Kamera tidak dapat digunakan.";

}


/* =========================================================
   START SCANNER
   ========================================================= */

async function mulaiScanner() {

  /*
   * Pastikan library ada
   */

  if (
    typeof Html5Qrcode ===
    "undefined"
  ) {

    tampilkanError(

      "<b>Scanner library gagal dimuat.</b>" +

      "<br><br>" +

      "Pastikan internet aktif lalu refresh."

    );

    return;

  }


  try {

    statusBox.textContent =
      "Meminta izin kamera...";


    /*
     * BUAT SCANNER
     */

    scanner =
      new Html5Qrcode(
        "reader"
      );


    /*
     * KONFIGURASI
     */

    const config = {

      fps: 10,

      qrbox: function(
        width,
        height
      ) {

        const size =
          Math.floor(
            Math.min(
              width,
              height
            ) * 0.72
          );


        return {

          width:
            size,

          height:
            size

        };

      },


      aspectRatio:
        1.0,


      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.EAN_8,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.UPC_E

      ]

    };


    /*
     * START KAMERA
     *
     * Gunakan environment agar
     * memilih kamera belakang.
     */

    await scanner.start(

      {
        facingMode:
          "environment"
      },

      config,

      function(decodedText) {

        barcodeBerhasil(
          decodedText
        );

      },

      function(errorMessage) {

        /*
         * Error scan sementara
         * memang normal.
         */

      }

    );


    scannerAktif =
      true;


    statusBox.textContent =
      "Kamera aktif. Arahkan ke barcode SKU.";


    kirimStatusSiap();

  }

  catch(error) {

    console.error(
      error
    );


    const text =
      String(
        error &&
        (
          error.message ||
          error.name ||
          error
        )
      );


    const lower =
      text.toLowerCase();


    if (
      lower.includes(
        "notallowederror"
      ) ||
      lower.includes(
        "permission"
      ) ||
      lower.includes(
        "denied"
      )
    ) {

      tampilkanError(

        "<b>IZIN KAMERA DITOLAK</b>" +

        "<br><br>" +

        "Buka pengaturan situs di Chrome " +

        "→ Kamera → Izinkan → kemudian " +

        "refresh halaman."

      );

    }


    else if (
      lower.includes(
        "notfounderror"
      )
    ) {

      tampilkanError(

        "<b>KAMERA TIDAK DITEMUKAN</b>" +

        "<br><br>" +

        "Pastikan HP memiliki kamera " +

        "dan kamera tidak sedang digunakan " +

        "aplikasi lain."

      );

    }


    else {

      tampilkanError(

        "<b>KAMERA TIDAK DAPAT DIGUNAKAN.</b>" +

        "<br><br>" +

        escapeHtml(text)

      );

    }

  }

}


/* =========================================================
   KEMBALI
   ========================================================= */

async function kembali() {

  await stopScanner();


  if (
    window.opener &&
    !window.opener.closed
  ) {

    window.close();

  }

  else {

    history.back();

  }

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHtml(
  value
) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* =========================================================
   HALAMAN SIAP
   ========================================================= */

window.addEventListener(
  "load",
  function() {

    mulaiScanner();

  }
);


/* =========================================================
   SAAT HALAMAN DITUTUP
   ========================================================= */

window.addEventListener(
  "beforeunload",
  function() {

    if (
      scanner &&
      scannerAktif
    ) {

      scanner.stop()
        .catch(
          function() {}
        );

    }

  }
);


</script>


</body>

</html>
